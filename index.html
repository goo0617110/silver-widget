<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>銀価格</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 60px;
    }

    .card {
      max-width: 420px;
      margin: auto;
      background: #222;
      border-radius: 24px;
      padding: 30px;
    }

    h1 {
      margin-bottom: 30px;
    }

    #price {
      font-size: 48px;
      font-weight: bold;
    }

    #total {
      font-size: 24px;
      margin-top: 20px;
    }

    #status {
      color: #aaa;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🥈 銀価格</h1>

    <div id="price">
      読み込み中...
    </div>

    <div id="total"></div>

    <div id="status">
      銀価格とドル円を取得中
    </div>
  </div>

 <script>
  async function updateSilverPrice() {
    try {
      const response = await fetch("data.json");
      const data = await response.json();

      document.getElementById("price").textContent =
        "¥" + data.yen_per_gram.toFixed(2) + " / g";

      document.getElementById("total").textContent =
        "648g = ¥" + data.total_648g.toLocaleString();

      document.getElementById("status").textContent =
        "銀 $" + data.silver_usd_oz +
        " / oz　USD/JPY " + data.usd_jpy +
        "　更新 " + data.updated;

    } catch (error) {
      document.getElementById("price").textContent = "取得エラー";
      document.getElementById("status").textContent = error.message;
    }
  }

  updateSilverPrice();
</script>

</body>
</html>
